name: Python Test CI-CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. 安装项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 检查 pytest 测试用例
      - name: Collect pytest tests
        run: |
          pytest --collect-only -q > test-results.txt

      # 5. 保存测试结果
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-results
          path: test-results.txt